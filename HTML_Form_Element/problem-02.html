<!DOCTYPE html>
<html>
    <head>
        <title>
            appointment booking 
        </title>
    </head>
    <body>
        <h1><center><b><u>Appointment Booking</u></b></center></h1>
        <p>Please fill out the form below to request an appointment with one of our specialists.
         Our team will contact you to confirm your booking.</p><br>
         <form method="POST">
         <fieldset>
            <legend><h2>Personal Detail</h2></legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="enter your name"><br><br>
            <label for="dob" >DOB:</label>
            <input type="date" id="dob" name="dob" ><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email"><br><br>
            <label for="mobile"> Phone Number:</label><br>
            <input type="tel" id="mobile" name="mobile" pattern="[0,9]{10}" required placeholder="Enter phone number"><br><br>
         </fieldset>
         </form>
         <fieldset>
         <legend><h2><center><b>Doctor Selection</b></center></h2></legend>
         <form method="POST">
            <label for="category">Choose a doctor:</label>
            <select id="category" name="category" required>
                <option value="select">Select</option>
                <option value="Dr. Alice Smith - Cardiology">Dr. Alice Smith - Cardiology</option>
                <option value="Dr. Bob Jones - Pediatrics">Dr. Bob Jones - Pediatrics</option>
                <option value="Dr. Carol Danvers - General Physician">Dr. Carol Danvers - General Physician</option>
                <option value="Dr. David Miller - Orthopedics">Dr. David Miller - Orthopedics</option>
                <option value="Dr. Emma Watson - Dermatology">Dr. Emma Watson - Dermatology</option>
            </select>
         </form>
         </fieldset>
         <fieldset>
            <legend><h2><b> Slot Booking</b></h2></legend>
            <form method="POST">
            <label for="slot booking">Date:</label>
            <input type="date" id="slot booking" name="slot booking" required><br><br>
            <label for="time slot">Time Slot:</label>
            <input type="time" id="time slot" name="time slot" required>
            </form>
         </fieldset>
         <form method="POST">
            <fieldset>
                <legend ><h2>Visit Type</h2></legend>
                <label for="visit type"></label>
                <input type="radio" id="New patient" name="new patient" required>
                <label for="new patient">New patient</label>
                <input type="radio" id="follow-up" name="follow-up" required>
                <label for="follow-up">Follow-up</label>
                <input type="radio" id="consultation" name="consultation" required>
                <label for="consultation">Consultation</label>
                <input type="radio" id="energency" name="emergency" required>
                <label for="emergency">Emergency</label>
            </fieldset>
         </form>
         <label for="pref_comm"><h2>Preferred Communication Method:</h2></label>
        <select id="pref_comm" name="pref_comm" required>
          <option value="select">Select</option>
          <option value="email">Email</option>
          <option value="phone">Phone Call</option>
          <option value="sms">SMS</option>
          <option value="offline">Offline</option>
        </select><br><br>
        <label for="reason">Reason for Visit:</label><br>
        <textarea id="reason" name="reason" rows="4" cols="50" maxlength="500"
         placeholder="Describe symptoms or reasons for booking..."></textarea><br><br>
         <a href="https://www.maxhealthcare.in/terms-and-conditions" target="_blank">
            Terms & Condition</a><br>
<input type="checkbox" id="terms" name="terms" required>
<label for="terms">I accept the appointment terms and conditions.</label><br><br>
<label for="patient_id">Patient ID (Optional):</label><br>
<input type="text" id="patient_id" name="patient_id" maxlength="10" placeholder="e.g., P-10293">
<br><br>
<input type="submit" value="Submit Request">
<input type="reset" value="Reset Form">
         

    </body>
</html>
