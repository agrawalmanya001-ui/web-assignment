<!DOCTYPE html>
<html>
    <head>
        <title>
            problem
        </title>
        <style>
            #container{
                display:grid;
                grid-template-rows: repeat(4,1fr);
                grid-template-columns: repeat(3,1fr);
                grid-template-areas: 
                "nav nav nav"
                "left left ri1"
                "left left ri2"
                "left left ri3";
                gap:20px;
                margin:10px;
             }
            .nav{
                grid-area: nav;
                background-color: yellow;
                height:100px;
                width:auto;
                padding: 10px;
             }
             .left{
                grid-area:left;
                background-color: red;
                 padding: 10px;
             }
             .right1{
                grid-area: ri1;
                background-color: greenyellow;
                 padding: 10px;
             }
             .right2{
                grid-area: ri2;
                background-color: greenyellow;
                 padding: 10px;
             }
             .right3{
                grid-area: ri3;
                background-color: greenyellow;
                 padding: 10px;
             }
             @media all and (max-width:767px) and (min-width:480px){
                #container{
                    grid-template-columns: repeat(3,1fr);
                    grid-template-rows: repeat(3,1fr);
                    grid-template-areas: 
                    "nav nav nav"
                    "left left left"
                    "ri1 ri2 ri3";
                }
             }
              @media all and (max-width:480px) {
                #container{
                    grid-template-columns: repeat(5,1fr);
                    grid-template-rows: repeat(1,1fr);
                    grid-template-areas: 
                    "nav"
                    "left"
                    "ri1"
                    "ri2"
                    "ri3";
                }
             }


        </style>
    </head>
    <body>
        <div id="container">
            <div class="nav" >Navigation</div>
            <div class="left">Left box</div>
            <div class="right1">Right box 1</div>
            <div class="right2">Right box 2</div>
            <div class="right3">Right box 3</div>
        </div>
    </body>
</html>
